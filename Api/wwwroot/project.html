<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проект</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="resources/images/logo.svg">

    <link rel="stylesheet" href="css/linkOverlay.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/project.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">

    <link rel="icon" type="image/svg" href="resources/images/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<div id="header"></div>

<section class="project-page">
    <div class="container">
        <div class="project-card">
            <div class="navigation-wrapper">
                <nav class="navigation">
                    <ul class="navigation-objs">
                        <li>
                            <a href="index.html">
                                <img src="resources/images/close.svg" alt="закрыть страницу проекта">
                            </a>
                        </li>
                        <li>
                            <a href="javascript:void(0);" onclick="openOverlay()">
                                <img src="resources/images/share.svg" alt="поделиться">
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="project-header">
                <h1 class="project-title" id="project-title"></h1>
                <span class="project-like like" id="project-like" role="button" tabindex="0" aria-label="Поставить лайк" aria-pressed="false">
                    <img class="like-img" src="resources/images/heart.svg" alt="" aria-hidden="true">
                    <span class="like-count">0</span>
                </span>
            </div>

            <div class="tabs">

                <button class="tab-btn active" data-tab="short">
                    Краткое описание
                </button>

                <button class="tab-btn" data-tab="custdev">
                    CustDev
                </button>

                <button class="tab-btn" data-tab="description">
                    Описание идеи
                </button>

                <button class="tab-btn" data-tab="mvp">
                    MVP
                </button>

                <button class="tab-btn" data-tab="roadmap">
                    RoadMap
                </button>

                <button class="tab-btn" data-tab="product">
                    Продукт
                </button>

            </div>

            <div class="tabs-content" id="tabs-content">

                <div class="tab active" id="short">
                    <p id="short-description"></p>
                    <div class="project-stack">
                        <h3>Стек:</h3>

                        <div class="icons" id="icons">
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <div class="table-caption">
                            <h3>Информация о времени создания проекта:</h3>
                        </div>

                        <table class="info-table">
                            <thead>
                            <tr>
                                <th>Год создания</th>
                                <td><p id="year"></p></td>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <th>Семестр</th>
                                <td><p id="semester"></p></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <section class="members-section">
                        <h3 class="members-title">Участники:</h3>
                        <div class="members-grid" id="members-grid"></div>
                    </section>

                </div>
            </div>

        </div>

    </div>
</section>
<div id="footer"></div>

<script src="js/app.js"></script>
<script src="js/header.js"></script>
<script type="module" src="js/project.js"></script>
<script src="js/tabs.js"></script>
<script src="js/cookie.js"></script>
<script src="js/linkOverlay.js" defer></script>
<script src="js/footer.js"></script>

</body>
</html>
